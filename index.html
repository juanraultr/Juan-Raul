<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUAN RAUL - Çuval Hesaplayıcısı</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding:20px}.container{max-width:520px;margin:auto;background:#fff;padding:20px;border-radius:15px;box-shadow:0 0 15px rgba(0,0,0,.2)}
.logo{text-align:center;font-size:28px;font-weight:bold;color:#c40000}.sub{text-align:center;color:#555;margin:8px 0 20px}
label{display:block;margin-top:15px;font-weight:bold}select,input{width:100%;padding:12px;margin-top:5px;border:1px solid #ccc;border-radius:10px;font-size:17px}
button{width:100%;margin-top:20px;padding:15px;background:#c40000;color:#fff;border:none;border-radius:10px;font-size:20px}
.result{display:none;margin-top:20px}details{margin:12px 0;border:1px solid #ddd;border-radius:10px;padding:8px}summary{cursor:pointer;font-weight:bold}
.bar{height:18px;background:#ddd;border-radius:20px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#00b050}
.info{padding:10px 5px;line-height:1.8}
</style></head><body><div class="container"><div class="logo">JUAN RAUL</div><div class="sub">Çuval Hesaplayıcısı</div>
<label>Çuval Türü</label><select id="bag">
<option value="500,350,80">🔵 Mavi Küçük</option><option value="800,500,110">🔴 Kırmızı Küçük</option><option value="1200,650,180">🔴 Kırmızı Büyük</option><option value="450,300,60">📦 Koli 80×50×50</option></select>
<label>Boxer</label><input id="boxer" type="number">
<label>Atlet</label><input id="atlet" type="number">
<label>Çorap (Düzine)</label><input id="sock" type="number">
<button onclick="hesapla()">Hesapla</button>
<div id="result" class="result"><h2 id="total"></h2><div id="bags"></div></div></div>
<script>
function hesapla(){
let k=bag.value.split(",").map(Number),b=+boxer.value||0,a=+atlet.value||0,s=+sock.value||0;
let oran=b/k[0]+a/k[1]+s/k[2],full=Math.floor(oran),rem=Math.round((oran-full)*100);
total.innerText="Toplam: "+oran.toFixed(2)+" Çuval";result.style.display="block";let html="";
let cnt=full+(rem>0||full===0?1:0);
for(let i=1;i<=cnt;i++){
let p=(i<=full)?100:rem;
let bb=Math.round(b*p/100/(p==100?full||1:1));
let aa=Math.round(a*p/100/(p==100?full||1:1));
let ss=Math.round(s*p/100/(p==100?full||1:1));
let color="#00b050";
if(p<50){color="#ff3b30";}else if(p<100){color="#ffc107";}
html+=`<details><summary>Çuval ${i} - %${p}<div class="bar"><div class="fill" style="width:${p}%;background:${color}"></div></div></summary>
<div class="info">Boxer: ${bb}<br>Atlet: ${aa}<br>Çorap: ${ss}</div></details>`;
}
bags.innerHTML=html;
}
</script></body></html>
