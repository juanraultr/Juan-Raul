<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUAN RAUL - Çuval Hesaplayıcısı</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding:20px}.container{max-width:520px;margin:auto;background:#fff;padding:20px;border-radius:15px;box-shadow:0 0 15px rgba(0,0,0,.2)}
.logo{text-align:center;font-size:28px;font-weight:bold;color:#c40000}.sub{text-align:center;color:#555;margin:8px 0 20px}
label{display:block;margin-top:15px;font-weight:bold}select,input,button{width:100%;padding:12px;margin-top:5px;border-radius:10px;font-size:17px}select,input{border:1px solid #ccc}button{margin-top:20px;padding:15px;background:#c40000;color:#fff;border:none;font-size:20px}
.result{display:none;margin-top:20px}details{margin:12px 0;border:1px solid #ddd;border-radius:10px;padding:8px}summary{cursor:pointer;font-weight:bold;list-style:none}summary::-webkit-details-marker{display:none}
.bar{height:18px;background:#ddd;border-radius:20px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#00b050}
.info{padding:10px 5px;line-height:1.8}
.mode-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.mode-btn{padding:12px;border:1px solid #c40000;background:#fff;color:#c40000;font-weight:bold;cursor:pointer}
.mode-btn.active{background:#c40000;color:#fff}
.note{margin-top:10px;font-size:13px;color:#666;line-height:1.5}
</style></head><body><div class="container"><div class="logo">JUAN RAUL</div><div class="sub">Çuval Hesaplayıcısı</div>
<label>Çuval Türü</label><select id="bag">
<option value="500,350,80">🔵 Mavi Küçük</option><option value="800,500,110">🔴 Kırmızı Küçük</option><option value="1200,650,180">🔴 Kırmızı Büyük</option><option value="450,300,60">📦 Koli 80×50×50</option></select>
<label>Boxer</label><input id="boxer" type="number" min="0">
<label>Atlet</label><input id="atlet" type="number" min="0">
<label>Çorap (Düzine)</label><input id="sock" type="number" min="0">
<label>Dağıtım Türü</label>
<div class="mode-wrap">
<button id="modeEqual" class="mode-btn active" type="button" onclick="setMode('equal')">⚖️ Eşit Dağıt</button>
<button id="modeProduct" class="mode-btn" type="button" onclick="setMode('product')">📦 Ürüne Göre Doldur</button>
</div>
<button onclick="hesapla()">Hesapla</button>
<div id="result" class="result"><h2 id="total"></h2><div id="bags"></div><div class="note">Eşit Dağıt: ürünler mevcut çuvallara dengeli paylaştırılır. Ürüne Göre Doldur: önce Boxer, sonra Atlet, sonra Çorap çuvallara sırayla yerleştirilir.</div></div></div>
<script>
let mode='equal';
function setMode(m){mode=m;modeEqual.classList.toggle('active',m==='equal');modeProduct.classList.toggle('active',m==='product');}
function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(2)}
function toplamCuval(k,b,a,s){return (b/k[0])+(a/k[1])+(s/k[2]);}
function makeBag(title,p,bb,aa,ss){let color="#00b050";if(p<50){color="#ff3b30";}else if(p<100){color="#ffc107";}return `<details><summary>${title} - %${p}<div class="bar"><div class="fill" style="width:${p}%;background:${color}"></div></div></summary><div class="info">Boxer: ${bb}<br>Atlet: ${aa}<br>Çorap: ${ss}</div></details>`;}
function hesapla(){
let k=bag.value.split(",").map(Number),b=+boxer.value||0,a=+atlet.value||0,s=+sock.value||0;
let html="";
if(mode==='equal'){
 let oran=toplamCuval(k,b,a,s),full=Math.floor(oran),rem=Math.round((oran-full)*100);
 total.innerText="Toplam: "+oran.toFixed(2)+" Çuval";result.style.display="block";
 let cnt=full+(rem>0||full===0?1:0);
 for(let i=1;i<=cnt;i++){
  let p=(i<=full)?100:rem;
  let bagsCount=p==100?(full||1):1;
  let bb=Math.round((b/cnt));
  let aa=Math.round((a/cnt));
  let ss=Math.round((s/cnt));
  if(i===cnt){bb=b-Math.round((cnt-1)*(b/cnt));aa=a-Math.round((cnt-1)*(a/cnt));ss=s-Math.round((cnt-1)*(s/cnt));}
  html+=makeBag(`Çuval ${i}`,p,bb,aa,ss);
 }
}else{
 let cap=[...k];
 let items=[{name:'Boxer',qty:b,cap:cap[0]},{name:'Atlet',qty:a,cap:cap[1]},{name:'Çorap',qty:s,cap:cap[2]}];
 let totalBags=0;items.forEach(x=>totalBags+=Math.ceil(x.qty/x.cap||0));if(totalBags===0) totalBags=1;
 total.innerText="Toplam: "+totalBags+" Çuval";result.style.display="block";
 let remaining={Boxer:b,Atlet:a,Çorap:s};
 let bagIndex=1;
 while(remaining.Boxer>0 || remaining.Atlet>0 || remaining.Çorap>0){
  let content={Boxer:0,Atlet:0,Çorap:0};
  let percent=0;
  for(const item of items){
   if(remaining[item.name]<=0) continue;
   let take=Math.min(remaining[item.name], item.cap);
   if(take>0 && percent===0){
    content[item.name]=take;remaining[item.name]-=take;percent=Math.round((take/item.cap)*100);
    break;
   }
  }
  if(percent===0) break;
  html+=makeBag(`Çuval ${bagIndex}`,percent,content.Boxer,content.Atlet,content['Çorap']);
  bagIndex++;
 }
}
 bags.innerHTML=html;
}
</script></body></html>
