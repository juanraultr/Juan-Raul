<style>
body {
  background: linear-gradient(135deg, #f0f0f0, #e0e0ff);
  padding: 20px;
  font-family: Arial;
}
.mode-wrap {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 8px;
}
.share-btn {
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}
.whatsapp { background:#25D366; color:#fff; border:none; }
.pdf { background:#c40000; color:#fff; border:none; }
</style>

<div class="mode-wrap">
  <button id="modeProduct" class="mode-btn active" type="button" onclick="setMode('product')">📦 حسب المنتج</button>
  <button id="modeEqual" class="mode-btn" type="button" onclick="setMode('equal')">⚖️ توزيع متساوي</button>
</div>

<button onclick="hesapla()">احسب</button>

<div id="result" class="result">
  <h2 id="total"></h2>
  <div id="bags"></div>
  <button class="share-btn whatsapp" onclick="shareWhatsApp()">📲 مشاركة واتساب</button>
  <button class="share-btn pdf" onclick="sharePDF()">📄 مشاركة PDF</button>
</div>

<script>
let mode='product'; // الوضع الافتراضي

function hesapla(){
  let k=bag.value.split(",").map(Number),
      b=+boxer.value||0,
      a=+atlet.value||0,
      s=+sock.value||0;
  let html="";
  if(mode==='equal'){
    let oran=(b/k[0])+(a/k[1])+(s/k[2]);
    total.innerText="المجموع: "+oran.toFixed(2)+" شوال";
    // باقي الكود كما هو لكن مع toFixed(2) بدل التقريب
  }else{
    // حساب حسب المنتج مع toFixed(2) للنتيجة
    let bagIndex=1;
    let rem={Boxer:b,Atlet:a,Çorap:s};
    while(rem.Boxer>0||rem.Atlet>0||rem.Çorap>0){
      let used=0,content={Boxer:0,Atlet:0,Çorap:0};
      let p=Math.min(rem.Boxer/k[0],1-used);
      if(p>0){content.Boxer=Math.round(p*k[0]);rem.Boxer-=content.Boxer;used+=p;}
      p=Math.min(rem.Atlet/k[1],1-used);
      if(p>0){content.Atlet=Math.round(p*k[1]);rem.Atlet-=content.Atlet;used+=p;}
      p=Math.min(rem.Çorap/k[2],1-used);
      if(p>0){content.Çorap=Math.round(p*k[2]);rem.Çorap-=content.Çorap;used+=p;}
      html+=makeBag(`شوال ${bagIndex}`,Math.round(used*100),content.Boxer,content.Atlet,content.Çorap);
      bagIndex++;
    }
    total.innerText="المجموع: "+(bagIndex-1).toFixed(2)+" شوال";
  }
  bags.innerHTML=html;
  result.style.display="block";
}

function shareWhatsApp(){
  let text=total.innerText;
  window.open("https://wa.me/?text="+encodeURIComponent(text),"blank");
}
function sharePDF(){
  alert("ميزة تصدير PDF ستضاف هنا لاحقًا");
}
</script>
