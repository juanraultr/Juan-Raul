<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUAN RAUL - Çuval Hesaplayıcısı</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.2);
}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
color:#c40000;
margin-bottom:5px;
}

.sub{
text-align:center;
margin-bottom:20px;
color:#555;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

select,input{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:10px;
font-size:17px;
}

button{
width:100%;
margin-top:20px;
padding:15px;
background:#c40000;
color:white;
border:none;
border-radius:10px;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#9d0000;
}

.result{
margin-top:20px;
padding:15px;
border-radius:10px;
background:#eee;
font-size:20px;
text-align:center;
display:none;
}

.bar{
margin-top:15px;
height:22px;
background:#ddd;
border-radius:30px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:#00b050;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
JUAN RAUL
</div>

<div class="sub">
Çuval Hesaplayıcısı
</div>

<label>Çuval Türü</label>

<select id="bag">

<option value="500,350,80">
🔵 Mavi Küçük
</option>

<option value="800,500,110">
🔴 Kırmızı Küçük
</option>

<option value="1200,650,180">
🔴 Kırmızı Büyük
</option>

<option value="450,300,60">
📦 Koli 80×50×50
</option>

</select>

<label>Boxer</label>
<input id="boxer" type="number" placeholder="0">

<label>Atlet</label>
<input id="atlet" type="number" placeholder="0">

<label>Çorap (Düzine)</label>
<input id="sock" type="number" placeholder="0">

<div class="result" id="result">

<div id="text"></div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

</div>

</div>

<script>

function hesapla(){

let kapasite=document.getElementById("bag").value.split(",");

let boxer = Number(document.getElementById("boxer").value || 0);
let atlet = Number(document.getElementById("atlet").value || 0);
let corap = Number(document.getElementById("sock").value || 0);

let oran=
(boxer/kapasite[0])+
(atlet/kapasite[1])+
(corap/kapasite[2]);

oran=Number(oran.toFixed(2));

let yuzde=(oran*100);

document.getElementById("result").style.display="block";

document.getElementById("text").innerHTML=
"<h2>"+oran+" Çuval</h2>"+
"<br>Doluluk Oranı : %"+yuzde.toFixed(1);

document.getElementById("fill").style.width=
Math.min(yuzde,100)+"%";

}

</script>

</body>
</html>
