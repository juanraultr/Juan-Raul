<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUAN RAUL - Çuval Hesaplayıcısı</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding:20px}
.container{max-width:520px;margin:auto;background:#fff;padding:20px;border-radius:15px;box-shadow:0 0 15px rgba(0,0,0,.2)}
.logo{text-align:center;margin-bottom:15px}
.logo img{width:100%;max-width:500px}
.sub{text-align:center;color:#555;margin:8px 0 20px}
label{display:block;margin-top:15px;font-weight:bold}
select,input,button{width:100%;padding:12px;margin-top:5px;border-radius:10px;font-size:17px}
select,input{border:1px solid #ccc}
button{margin-top:20px;padding:15px;background:#c40000;color:#fff;border:none;font-size:20px}
.result{display:none;margin-top:20px}
details{margin:12px 0;border:1px solid #ddd;border-radius:10px;padding:8px}
summary{cursor:pointer;font-weight:bold;list-style:none}
summary::-webkit-details-marker{display:none}
.bar{height:18px;background:#ddd;border-radius:20px;overflow:hidden;margin-top:8px}
.fill{height:100%;background:#00b050}
.info{padding:10px 5px;line-height:1.8}
.toggle-wrap{display:flex;justify-content:flex-end;align-items:center;margin-top:-30px;margin-bottom:10px}
.toggle-wrap label{font-size:12px;margin-right:5px;color:#c40000;font-weight:bold}
.toggle{width:30px;height:15px;background:#ccc;border-radius:15px;position:relative;cursor:pointer}
.toggle::after{content:"";width:13px;height:13px;background:#fff;border-radius:50%;position:absolute;top:1px;left:1px;transition:0.3s}
.toggle.active{background:#c40000}
.toggle.active::after{left:16px}
#shareBtn{display:none;margin-top:10px;background:#007bff}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <img src="AISelect_20260805_103617_Drive.png" alt="JUAN RAUL Logo">
  </div>
  <div class="sub">Çuval Hesaplayıcısı</div>
  
  <div class="toggle-wrap">
    <label>Eşit Dağıt</label>
    <div id="toggle" class="toggle"></div>
  </div>

  <!-- رابط الطلبية -->
  <label>Rapor Linki</label>
  <input id="orderLink" type="text" placeholder="https://orders.mc.app/...">
  <button onclick="parseLink()">Linkten Oku</button>
  
  <label>Çuval Türü</label>
  <select id="bag">
    <option value="500,350,80">🔵 Mavi Küçük</option>
    <option value="800,500,110">🔴 Kırmızı Küçük</option>
    <option value="1200,650,180">🔴 Kırmızı Büyük</option>
    <option value="450,300,60">📦 Koli 80×50×50</option>
  </select>
  
  <label>Boxer</label><input id="boxer" type="number" min="0">
  <label>Atlet</label><input id="atlet" type="number" min="0">
  <label>Çorap (Düzine)</label><input id="sock" type="number" min="0">
  
  <button onclick="hesapla()">Hesapla</button>
  
  <div id="result" class="result">
    <h2 id="total"></h2>
    <div id="bags"></div>
    <button id="shareBtn" onclick="exportPDF()">PDF Olarak Paylaş</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
let mode='product';
const toggle=document.getElementById('toggle');
toggle.addEventListener('click',()=>{
  toggle.classList.toggle('active');
  mode=toggle.classList.contains('active')?'equal':'product';
});

// قراءة الطلبية من الرابط
async function parseLink(){
  let link = document.getElementById("orderLink").value;
  try {
    let res = await fetch(link);
    let text = await res.text();

    // Boxer
    let boxerMatch = text.match(/boxer.*?(\d+)\s*×\s*(\d+)/i);
    if(boxerMatch){
      boxer.value = parseInt(boxerMatch[1]) * parseInt(boxerMatch[2]);
    }

    // Atlet / Fanila / Korse
    let atletMatch = text.match(/(atlet|fanila|korse).*?(\d+)\s*×\s*(\d+)/i);
    if(atletMatch){
      atlet.value = parseInt(atletMatch[2]) * parseInt(atletMatch[3]);
    }

    // Çorap / Patik / Yarım Kunş
    let sockMatch = text.match(/(çorap|patik|yarım\s*kunş).*?(\d+)\s*×\s*(\d+)/i);
    if(sockMatch){
      let dozen = parseInt(sockMatch[2]) * parseInt(sockMatch[3]);
      sock.value = dozen/12;
    }

    hesapla();
  } catch(e){
    alert("Bu linkten veri okunamadı!");
  }
}

function toplamCuval(k,b,a,s){return (b/k[0])+(a/k[1])+(s/k[2]);}
function makeBag(title,p,bb,aa,ss){
  let color="#00b050";
  if(p<50){color="#ff3b30";}else if(p<100){color="#ffc107";}
  let info="";
  if(bb>0) info+="Boxer: "+bb+"<br>";
  if(aa>0) info+="Atlet: "+aa+"<br>";
  if(ss>0) info+="Çorap: "+ss+"<br>";
  return `<details><summary>${title} - %${p}<div class="bar"><div class="fill" style="width:${p}%;background:${color}"></div></div></summary><div class="info">${info}</div></details>`;
}
function hesapla(){
  let k=bag.value.split(",").map(Number),
      b=+boxer.value||0,
      a=+atlet.value||0,
      s=+sock.value||0;
  let html="";
  let oran=toplamCuval(k,b,a,s);
  total.innerText="Toplam: "+oran.toFixed(2)+" Çuval";
  result.style.display="block";
  
  if(mode==='equal'){
    let cnt=Math.ceil(oran);
    let percent=(oran/cnt*100).toFixed(0);
    for(let i=1;i<=cnt;i++){
      let bb=Math.round(b/cnt);
      let aa=Math.round(a/cnt);
      let ss=Math.round(s/cnt);
      if(i===cnt){
        bb=b-Math.round((cnt-1)*(b/cnt));
        aa=a-Math.round((cnt-1)*(a/cnt));
        ss=s-Math.round((cnt-1)*(s/cnt));
      }
      html+=makeBag(`Çuval ${i}`,percent,bb,aa,ss);
    }
  }else{
    let rem={Boxer:b,Atlet:a,Çorap:s};
    let bagIndex=1;
    while(rem.Boxer>0||rem.Atlet>0||rem.Çorap>0){
      let used=0,content={Boxer:0,Atlet:0,Çorap:0};
      let p;
      p=Math.min(rem.Boxer/k[0],1-used);
      if(p>0){content.Boxer=Math.round(p*k[0]);rem.Boxer-=content.Boxer;used+=p;}
      p=Math.min(rem.Atlet/k[1],1-used);
      if(p>0){content.Atlet=Math.round(p*k[1]);rem.Atlet-=content.Atlet;used+=p;}
      p=Math.min(rem['Çorap']/k[2],1-used);
      if(p>0){content['Çorap']=Math.round(p*k[2]);rem['Çorap']-=content['Çorap'];used+=p;}
      html+=makeBag(`Çuval ${bagIndex}`,Math.round(used*100),content.Boxer,content.Atlet,content['Çorap']);
      bagIndex++;
    }
  }
    bags.innerHTML = html;
  document.getElementById("shareBtn").style.display = "block";
}

async function exportPDF() {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();

  pdf.setFont("helvetica");
  pdf.setFontSize(18);
  pdf.text("JUAN RAUL", 20, 20);
  pdf.setFontSize(14);
  pdf.text("Cuval Raporu", 20, 30);

  pdf.setFontSize(12);
  pdf.text(total.innerText, 20, 45);

  let y = 60;

  document.querySelectorAll("#bags details").forEach((bag) => {
    const title = bag.querySelector("summary").innerText;
    const info = bag.querySelector(".info").innerText;

    pdf.text(title, 20, y);
    y += 7;

    info.split("\n").forEach(line => {
      if (line.trim()) {
        pdf.text(line.trim(), 25, y);
        y += 6;
      }
    });

    y += 5;

    if (y > 270) {
      pdf.addPage();
      y = 20;
    }
  });

  pdf.save("JUAN_RAUL_Cuval_Raporu.pdf");
}
</script>
</body>
</html>
