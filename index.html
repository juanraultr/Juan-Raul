<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUAN RAUL - Çuval Hesaplayıcısı</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5;padding:20px}
.container{max-width:520px;margin:auto;background:#fff;padding:20px;border-radius:15px;box-shadow:0 0 15px rgba(0,0,0,.2)}
.logo{text-align:center;font-size:28px;font-weight:bold;color:#c40000}
.sub{text-align:center;color:#555;margin:8px 0 20px}
label{display:block;margin-top:15px;font-weight:bold}
select,input{width:100%;padding:12px;margin-top:5px;border:1px solid #ccc;border-radius:10px;font-size:17px}
button{width:100%;margin-top:20px;padding:15px;background:#c40000;color:#fff;border:none;border-radius:10px;font-size:20px;cursor:pointer}
.result{display:none;margin-top:20px}
.bag{margin-top:12px}
.bar{height:20px;background:#ddd;border-radius:20px;overflow:hidden}
.fill{height:100%;background:#00b050}
</style>
</head>
<body>
<div class="container">
<div class="logo">JUAN RAUL</div>
<div class="sub">Çuval Hesaplayıcısı</div>

<label>Çuval Türü</label>
<select id="bag">
<option value="500,350,80">🔵 Mavi Küçük</option>
<option value="800,500,110">🔴 Kırmızı Küçük</option>
<option value="1200,650,180">🔴 Kırmızı Büyük</option>
<option value="450,300,60">📦 Koli 80×50×50</option>
</select>

<label>Boxer</label>
<input id="boxer" type="number" placeholder="0">
<label>Atlet</label>
<input id="atlet" type="number" placeholder="0">
<label>Çorap (Düzine)</label>
<input id="sock" type="number" placeholder="0">

<button onclick="hesapla()">Hesapla</button>

<div class="result" id="result">
<h2 id="total"></h2>
<div id="bags"></div>
</div>
</div>

<script>
function hesapla(){
 let k=document.getElementById("bag").value.split(",");
 let boxer=Number(document.getElementById("boxer").value||0);
 let atlet=Number(document.getElementById("atlet").value||0);
 let corap=Number(document.getElementById("sock").value||0);
 let oran=(boxer/k[0])+(atlet/k[1])+(corap/k[2]);
 document.getElementById("result").style.display="block";
 document.getElementById("total").innerText="Toplam: "+oran.toFixed(2)+" Çuval";
 let full=Math.floor(oran);
 let rem=Math.round((oran-full)*100);
 let html="";
 for(let i=1;i<=full;i++){
   html+=`<div class="bag"><b>Çuval ${i} - %100</b><div class="bar"><div class="fill" style="width:100%"></div></div></div>`;
 }
 if(rem>0 || full===0){
   html+=`<div class="bag"><b>Çuval ${full+1} - %${rem}</b><div class="bar"><div class="fill" style="width:${rem}%"></div></div></div>`;
 }
 document.getElementById("bags").innerHTML=html;
}
</script>
</body>
</html>
