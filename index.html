<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çuval Hesaplayıcı</title>
<style>
body{font-family:Arial;background:#f4f4f4;margin:0}
.box{max-width:420px;margin:30px auto;background:#fff;padding:20px;border-radius:12px}
h2{text-align:center;color:#c00}
label{display:block;margin-top:12px;font-weight:bold}
select,input,button{width:100%;padding:10px;margin-top:6px}
button{background:#c00;color:#fff;border:0;border-radius:8px}
#r{margin-top:20px;background:#eef;padding:10px;border-radius:8px}
</style>
</head>
<body>
<div class="box">
<h2>Çuval Hesaplayıcı</h2>
<label>Ürün</label>
<select id="p">
<option value="boxer">Boxer</option>
<option value="atlet">Atlet</option>
<option value="corap">Çorap (Düzine)</option>
</select>
<label>Adet</label>
<input id="q" type="number">
<label>Çuval</label>
<select id="b">
<option value="mavi">🔵 Mavi Küçük</option>
<option value="ks">🔴 Kırmızı Küçük</option>
<option value="kb">🔴 Kırmızı Büyük</option>
<option value="koli">📦 Koli 80×50×50</option>
</select>
<button onclick="hesapla()">Hesapla</button>
<div id="r"></div>
</div>
<script>
const d={
mavi:{boxer:500,atlet:350,corap:80},
ks:{boxer:800,atlet:500,corap:110},
kb:{boxer:1200,atlet:650,corap:180},
koli:{boxer:450,atlet:300,corap:60}
};
function hesapla(){
let p=document.getElementById('p').value;
let b=document.getElementById('b').value;
let q=Number(document.getElementById('q').value);
if(!q){r.innerHTML="Lütfen adet girin";return;}
let c=d[b][p];
let full=Math.floor(q/c), rem=q%c;
r.innerHTML=`Bir çuval kapasitesi: <b>${c}</b><br>Tam çuval: <b>${full}</b><br>Kalan: <b>${rem}</b><br>Toplam: <b>${(q/c).toFixed(2)}</b>`;
}
</script>
</body>
</html>
